spring.application.name=FlashTix

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flashtix}
spring.datasource.username=${DB_USER:flashtix}
spring.datasource.password=${DB_PASSWORD:flashtix_dev}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true

server.port=8080

# FlashTix JWT authentication
flashtix.jwt.secret-base64=${FLASHTIX_JWT_SECRET_BASE64}
flashtix.jwt.issuer=flashtix
flashtix.jwt.expiration-minutes=30


# Razorpay webhook authentication
flashtix.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}



# Razorpay Test Mode
flashtix.razorpay.orders-enabled=${RAZORPAY_ORDERS_ENABLED:false}
flashtix.razorpay.key-id=${RAZORPAY_KEY_ID:}
flashtix.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
